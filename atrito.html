<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Eletrização por Atrito</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:     #030a10;
  --panel:  #071018;
  --card:   #0b1a28;
  --cyan:   #00f0ff;
  --yellow: #f5e200;
  --pink:   #ff0060;
  --dim:    #1a3a50;
  --muted:  #2a5060;
  --text:   #d0f0ff;
  --f1: 'Orbitron', monospace;
  --f2: 'Share Tech Mono', monospace;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0 }
body { background:var(--bg); color:var(--text); font-family:var(--f2); min-height:100vh }
body::before {
  content:''; position:fixed; inset:0; pointer-events:none;
  background-image: linear-gradient(rgba(0,240,255,.025) 1px,transparent 1px), linear-gradient(90deg,rgba(0,240,255,.025) 1px,transparent 1px);
  background-size:40px 40px;
}
.page { max-width:1060px; margin:0 auto; padding:28px 16px 50px; position:relative; z-index:1 }
.back { display:inline-block; font-family:var(--f1); font-size:10px; letter-spacing:3px; color:var(--muted); border:1px solid var(--dim); padding:6px 14px; border-radius:3px; text-decoration:none; margin-bottom:14px }
.hdr-tag { font-size:10px; letter-spacing:4px; color:var(--cyan); opacity:.7; margin-bottom:6px }
.hdr-title { font-family:var(--f1); font-size:clamp(1.2rem,4vw,1.9rem); font-weight:900; letter-spacing:.06em; text-transform:uppercase; text-shadow:0 0 16px var(--cyan); margin-bottom:24px }
.hdr-title span { color:var(--yellow); text-shadow:0 0 16px var(--yellow) }
.grid { display:grid; grid-template-columns:1fr 300px; gap:16px }
@media(max-width:740px){ .grid { grid-template-columns:1fr } }
.cw { background:var(--panel); border:1px solid var(--dim); border-radius:6px; overflow:hidden; position:relative }
#c { display:block; width:100% }
.hint { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:2px; color:var(--muted); pointer-events:none; white-space:nowrap; transition:opacity .4s }
.btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px }
.btn { font-family:var(--f1); font-size:10px; letter-spacing:2px; text-transform:uppercase; padding:10px 18px; border-radius:3px; cursor:pointer; background:transparent; transition:all .2s }
.bc { color:var(--cyan); border:1px solid var(--cyan) }
.bc:hover { background:var(--cyan); color:#000; box-shadow:0 0 12px var(--cyan) }
.bc:disabled { opacity:.3; cursor:not-allowed }
.by { color:var(--yellow); border:1px solid var(--yellow) }
.by:hover { background:var(--yellow); color:#000 }
.bp { color:var(--pink); border:1px solid var(--pink) }
.bp:hover { background:var(--pink); color:#000 }
.side { background:var(--panel); border:1px solid var(--dim); border-radius:6px; padding:18px; display:flex; flex-direction:column; gap:16px }
.slbl { font-size:10px; letter-spacing:3px; color:var(--cyan); text-transform:uppercase; padding-bottom:7px; border-bottom:1px solid var(--dim) }
.meters { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px }
.meter { background:var(--card); border:1px solid var(--dim); border-radius:5px; padding:10px; text-align:center }
.mn { font-size:9px; letter-spacing:2px; color:var(--muted); margin-bottom:5px }
.mv { font-family:var(--f1); font-size:1.3rem; font-weight:700 }
.mu { font-size:9px; color:var(--muted); margin-top:2px }
.bw { height:3px; background:var(--dim); border-radius:2px; margin-top:7px; overflow:hidden }
.bb { height:100%; border-radius:2px; width:0%; transition:width .4s, background .4s }
.pos { color:var(--yellow); text-shadow:0 0 8px var(--yellow) }
.neg { color:var(--cyan); text-shadow:0 0 8px var(--cyan) }
.neu { color:var(--muted) }
.ctrl label { display:block; font-size:10px; letter-spacing:2px; color:var(--cyan); margin-bottom:6px }
select { width:100%; background:var(--card); border:1px solid var(--muted); color:var(--text); font-family:var(--f2); font-size:12px; padding:8px 10px; border-radius:3px }
select:focus { outline:none; border-color:var(--cyan) }
.sr { display:flex; align-items:center; gap:10px }
input[type=range] { flex:1; -webkit-appearance:none; height:3px; border-radius:2px; background:var(--dim); outline:none; cursor:pointer }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:var(--cyan); box-shadow:0 0 6px var(--cyan) }
.sv { font-size:13px; color:var(--cyan); min-width:22px; text-align:right }
.mdesc { background:var(--card); border:1px solid var(--dim); border-radius:4px; padding:9px; font-size:11px; color:var(--muted); line-height:1.6; margin-top:6px }
.log { background:var(--card); border:1px solid var(--dim); border-radius:4px; padding:9px; max-height:100px; overflow-y:auto; font-size:11px; line-height:1.8 }
.log::-webkit-scrollbar { width:3px }
.log::-webkit-scrollbar-thumb { background:var(--dim); border-radius:2px }
.le { display:flex; gap:7px }
.lt { color:var(--cyan); opacity:.6; flex-shrink:0 }
.lm { color:var(--text) }
.lev { color:var(--yellow) }
.lrs { color:var(--pink) }
</style>
</head>
<body>
<div class="page">
  <a class="back" href="index.html">← VOLTAR</a>
  <div class="hdr-tag">// SIM_01 · ELETROSTÁTICA</div>
  <h1 class="hdr-title">Eletrização por <span>Atrito</span></h1>

  <div class="grid">
    <div>
      <div class="cw">
        <canvas id="c"></canvas>
        <div class="hint" id="hint">PRESSIONE FRICCIONAR PARA INICIAR</div>
      </div>
      <div class="btns">
        <button class="btn bc" id="btnRub" onclick="startRub()">⚡ Friccionar</button>
        <button class="btn by" id="btnAuto" onclick="toggleAuto()">↻ Auto</button>
        <button class="btn bp" onclick="resetSim()">✕ Resetar</button>
      </div>
    </div>

<div class="side">
  <div>
    <div class="slbl">Carga Elétrica</div>
    <div class="meters">
      <div class="meter">
        <div class="mn" id="mnA">OBJ A</div>
        <div class="mv neu" id="mvA">0</div>
        <div class="mu">u.c.</div>
        <div class="bw"><div class="bb" id="bbA"></div></div>
      </div>
      <div class="meter">
        <div class="mn" id="mnB">OBJ B</div>
        <div class="mv neu" id="mvB">0</div>
        <div class="mu">u.c.</div>
        <div class="bw"><div class="bb" id="bbB"></div></div>
      </div>
    </div>
  </div>

  <div class="ctrl">
    <label>Material A (superior)</label>
    <select id="selA" onchange="onMat()">
      <option value="glass">Vidro</option>
      <option value="fur">Pele de Animal</option>
      <option value="wool">Lã</option>
      <option value="nylon">Nylon</option>
      <option value="paper">Papel</option>
      <option value="rubber">Borracha</option>
    </select>
    <div class="mdesc" id="dA"></div>
  </div>

  <div class="ctrl">
    <label>Material B (inferior)</label>
    <select id="selB" onchange="onMat()">
      <option value="silk">Seda</option>
      <option value="wool">Lã</option>
      <option value="fur">Pele de Animal</option>
      <option value="rubber" selected>Borracha</option>
      <option value="plastic">Plástico</option>
      <option value="amber">Âmbar</option>
    </select>
    <div class="mdesc" id="dB"></div>
  </div>

  <div class="ctrl">
    <label>Intensidade do Atrito</label>
    <div class="sr">
      <input type="range" id="sI" min="1" max="10" value="5" oninput="document.getElementById('vI').textContent=this.value">
      <span class="sv" id="vI">5</span>
    </div>
  </div>

  <div class="ctrl">
    <label>Velocidade da Animação</label>
    <div class="sr">
      <input type="range" id="sS" min="1" max="10" value="5" oninput="document.getElementById('vS').textContent=this.value">
      <span class="sv" id="vS">5</span>
    </div>
  </div>

  <div>
    <div class="slbl" style="margin-bottom:8px">Log de Eventos</div>
    <div class="log" id="log"></div>
  </div>
</div>

  </div>
</div>

<script>
// ═══ MATERIAIS ═══
var MAT = {
  glass:   {name:'Vidro',       tv:8,  col:'#88ccee', desc:'Cede elétrons com facilidade.'},
  fur:     {name:'Pele Animal', tv:7,  col:'#c8a050', desc:'Alta tendência a ceder elétrons.'},
  wool:    {name:'Lã',          tv:6,  col:'#e8d060', desc:'Perde elétrons para a maioria dos materiais.'},
  nylon:   {name:'Nylon',       tv:5,  col:'#80ccff', desc:'Posição intermediária na série.'},
  silk:    {name:'Seda',        tv:4,  col:'#ffb8d0', desc:'Pode ceder ou receber dependendo do par.'},
  paper:   {name:'Papel',       tv:3,  col:'#e8e8d0', desc:'Posição intermediária.'},
  rubber:  {name:'Borracha',    tv:1,  col:'#445566', desc:'Forte tendência a receber elétrons.'},
  plastic: {name:'Plástico',    tv:0,  col:'#6688cc', desc:'Excelente receptor de elétrons.'},
  amber:   {name:'Âmbar',       tv:-1, col:'#cc6010', desc:'Máxima tendência a receber elétrons.'}
};

// ═══ ESTADO ═══
var S = {
  cA:0, cB:0, MAX:20,
  rubbing:false, autoOn:false, autoTimer:null,
  rubDir:1, rubOff:0, rubCycle:0,
  elec:[], sparks:[], labs:[],
  gA:0, gB:0
};

// ═══ CANVAS ═══
var cv = document.getElementById('c');
var cx = cv.getContext('2d');

function resize() {
  var wrap = cv.parentElement;
  var w = wrap.clientWidth || wrap.offsetWidth || window.innerWidth;
  // desconta padding da .page (32px cada lado)
  if (w <= 0) w = window.innerWidth - 32;
  cv.width  = w;
  cv.height = Math.min(360, Math.max(240, w * 0.42));
}
resize();
// segundo resize após o layout estar pronto no WebView
setTimeout(resize, 100);
setTimeout(resize, 400);
window.addEventListener('resize', resize);

// retângulo arredondado — sem roundRect nativo
function rrect(x, y, w, h, r) {
  if (r < 0) r = 0;
  if (r > w/2) r = w/2;
  if (r > h/2) r = h/2;
  cx.beginPath();
  cx.moveTo(x+r, y);
  cx.lineTo(x+w-r, y);
  cx.quadraticCurveTo(x+w, y,   x+w, y+r);
  cx.lineTo(x+w, y+h-r);
  cx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  cx.lineTo(x+r, y+h);
  cx.quadraticCurveTo(x, y+h, x, y+h-r);
  cx.lineTo(x, y+r);
  cx.quadraticCurveTo(x, y, x+r, y);
  cx.closePath();
}

// converte hex #rrggbb para "r,g,b"
function h2r(h) {
  return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);
}

function getPos() {
  var mx = cv.width/2;
  var my = cv.height/2;
  var w  = Math.min(160, cv.width*0.28);
  var h  = Math.min(110, cv.height*0.52);
  var gap = 2; // distância mínima entre os corpos (quase encostados)
  return {
    ax: mx - w/2 - gap,  ay: my + S.rubOff,   // A desliza para cima/baixo
    bx: mx + w/2 + gap,  by: my - S.rubOff,   // B desliza no sentido oposto
    w: w, h: h
  };
}

// ═══ TEXTURAS DOS MATERIAIS ═══
function drawTexture(key, x, y, w, h) {
  cx.save();
  // clip dentro do corpo
  rrect(x, y, w, h, 8);
  cx.clip();

  if (key === 'glass') {
    // listras diagonais finas — aparência de vidro
    cx.strokeStyle = 'rgba(255,255,255,0.18)';
    cx.lineWidth = 1;
    for (var i = -h; i < w+h; i += 14) {
      cx.beginPath(); cx.moveTo(x+i, y); cx.lineTo(x+i+h, y+h); cx.stroke();
    }
    // reflexo
    var g = cx.createLinearGradient(x, y, x+w*0.4, y+h);
    g.addColorStop(0,'rgba(255,255,255,0.18)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    cx.fillStyle = g; cx.fillRect(x, y, w*0.4, h);

  } else if (key === 'fur') {
    // pelos — traços curvos
    cx.strokeStyle = 'rgba(180,130,60,0.45)';
    cx.lineWidth = 1.2;
    for (var i = 0; i < 28; i++) {
      var fx = x + Math.random()*w;
      var fy = y + Math.random()*h;
      cx.beginPath();
      cx.moveTo(fx, fy);
      cx.quadraticCurveTo(fx+(Math.random()-.5)*10, fy-8-Math.random()*8, fx+(Math.random()-.5)*6, fy-14-Math.random()*6);
      cx.stroke();
    }

  } else if (key === 'wool') {
    // ondas horizontais — textura de lã
    cx.strokeStyle = 'rgba(240,210,80,0.35)';
    cx.lineWidth = 2;
    for (var row = y+8; row < y+h-4; row += 9) {
      cx.beginPath(); cx.moveTo(x+2, row);
      for (var px = x+2; px < x+w-2; px += 8) {
        cx.quadraticCurveTo(px+4, row-5, px+8, row);
      }
      cx.stroke();
    }

  } else if (key === 'nylon') {
    // grade fina — fibra sintética
    cx.strokeStyle = 'rgba(120,200,255,0.2)';
    cx.lineWidth = 0.8;
    for (var i = x+6; i < x+w; i += 8) {
      cx.beginPath(); cx.moveTo(i, y); cx.lineTo(i, y+h); cx.stroke();
    }
    for (var j = y+6; j < y+h; j += 8) {
      cx.beginPath(); cx.moveTo(x, j); cx.lineTo(x+w, j); cx.stroke();
    }

  } else if (key === 'silk') {
    // gradiente suave diagonal — brilho de seda
    var g = cx.createLinearGradient(x, y, x+w, y+h);
    g.addColorStop(0,   'rgba(255,180,210,0.0)');
    g.addColorStop(0.35,'rgba(255,255,255,0.22)');
    g.addColorStop(0.5, 'rgba(255,180,210,0.0)');
    g.addColorStop(0.75,'rgba(255,255,255,0.12)');
    g.addColorStop(1,   'rgba(255,180,210,0.0)');
    cx.fillStyle = g; cx.fillRect(x, y, w, h);

  } else if (key === 'paper') {
    // linhas horizontais finas — fibras de papel
    cx.strokeStyle = 'rgba(220,220,190,0.2)';
    cx.lineWidth = 0.8;
    for (var j = y+5; j < y+h; j += 5) {
      cx.beginPath(); cx.moveTo(x+2, j); cx.lineTo(x+w-2, j); cx.stroke();
    }

  } else if (key === 'rubber') {
    // faixas grossas — borracha vulcanizada
    cx.fillStyle = 'rgba(0,0,0,0.18)';
    for (var j = y; j < y+h; j += 10) {
      cx.fillRect(x, j, w, 5);
    }
    // brilho lateral
    var g = cx.createLinearGradient(x, y, x+12, y);
    g.addColorStop(0,'rgba(255,255,255,0.12)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    cx.fillStyle = g; cx.fillRect(x, y, 12, h);

  } else if (key === 'plastic') {
    // faixas verticais + reflexo
    cx.strokeStyle = 'rgba(100,140,220,0.2)';
    cx.lineWidth = 1;
    for (var i = x+8; i < x+w; i += 10) {
      cx.beginPath(); cx.moveTo(i, y); cx.lineTo(i, y+h); cx.stroke();
    }
    var g = cx.createLinearGradient(x, y, x+w*0.3, y);
    g.addColorStop(0,'rgba(255,255,255,0.2)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    cx.fillStyle = g; cx.fillRect(x, y, w*0.3, h);

  } else if (key === 'amber') {
    // anéis concêntricos — inclusões do âmbar
    cx.strokeStyle = 'rgba(200,90,10,0.3)';
    cx.lineWidth = 1.5;
    var cx2 = x+w/2, cy2 = y+h/2;
    for (var r = 10; r < Math.max(w,h); r += 14) {
      cx.beginPath();
      cx.arc(cx2, cy2, r, 0, 6.2832);
      cx.stroke();
    }
  }
  cx.restore();
}

function drawObj(ox, oy, w, h, key, charge, glow) {
  var m   = MAT[key];
  var abs = charge < 0 ? -charge : charge;
  var gc  = charge > 0 ? '#f5e200' : charge < 0 ? '#00f0ff' : '#335566';
  var rgb = h2r(m.col);

  // halo de brilho
  if (abs > 0 || glow > 0.05) {
    var rad = 30 + abs*3 + glow*28;
    cx.globalAlpha = Math.min(0.45, glow*0.7 + abs*0.022);
    cx.fillStyle = gc;
    cx.beginPath();
    cx.arc(ox, oy, rad, 0, 6.2832);
    cx.fill();
    cx.globalAlpha = 1;
  }

  if (abs > 0 || glow > 0.1) { cx.shadowColor = gc; cx.shadowBlur = 8 + glow*14; }

  // corpo base
  rrect(ox-w/2, oy-h/2, w, h, 8);
  cx.fillStyle = 'rgba('+rgb+',0.82)';
  cx.fill();
  cx.shadowBlur = 0;

  // textura do material
  drawTexture(key, ox-w/2, oy-h/2, w, h);

  // borda
  rrect(ox-w/2, oy-h/2, w, h, 8);
  cx.strokeStyle = abs === 0 ? 'rgba(0,200,255,0.2)' : gc;
  cx.lineWidth = 1.5 + abs*0.1;
  if (abs > 0 || glow > 0.1) { cx.shadowColor = gc; cx.shadowBlur = 8 + glow*14; }
  cx.stroke();
  cx.shadowBlur = 0;

  // nome
  cx.fillStyle = 'rgba(255,255,255,0.88)';
  cx.font = 'bold '+Math.floor(w*0.12)+'px Share Tech Mono, monospace';
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.fillText(m.name.toUpperCase(), ox, oy);

  // sinal de carga
  if (abs > 0) {
    cx.font = 'bold '+Math.floor(h*0.28)+'px Orbitron, monospace';
    cx.fillStyle = charge > 0 ? '#f5e200' : '#00f0ff';
    cx.shadowColor = cx.fillStyle; cx.shadowBlur = 8;
    cx.fillText(charge > 0 ? '+' : '-', ox, oy - h/2 + h*0.22);
    cx.shadowBlur = 0;
  }
}

function drawParticles() {
  var i, a;
  for (i = 0; i < S.elec.length; i++) {
    var e = S.elec[i];
    a = e.life/e.ml; if (a < 0) a = 0; if (a > 1) a = 1;
    cx.globalAlpha = a;
    cx.fillStyle = '#00f0ff';
    cx.shadowColor = '#00f0ff';
    cx.shadowBlur  = 8;
    cx.beginPath();
    cx.arc(e.x, e.y, 4*a+1, 0, 6.2832);
    cx.fill();
  }
  for (i = 0; i < S.sparks.length; i++) {
    var sp = S.sparks[i];
    a = sp.life/sp.ml; if (a < 0) a = 0; if (a > 1) a = 1;
    cx.globalAlpha = a;
    cx.strokeStyle = '#f5e200';
    cx.lineWidth   = a*2;
    cx.shadowColor = '#f5e200';
    cx.shadowBlur  = 5;
    cx.beginPath();
    cx.moveTo(sp.x, sp.y);
    cx.lineTo(sp.x+sp.vx*5, sp.y+sp.vy*5);
    cx.stroke();
  }
  for (i = 0; i < S.labs.length; i++) {
    var lb = S.labs[i];
    a = lb.life/lb.ml; if (a < 0) a = 0; if (a > 1) a = 1;
    cx.globalAlpha = a;
    cx.fillStyle   = lb.c;
    cx.shadowColor = lb.c;
    cx.shadowBlur  = 10;
    cx.font = 'bold '+lb.sz+'px Orbitron, monospace';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText(lb.t, lb.x, lb.y);
  }
  cx.globalAlpha = 1;
  cx.shadowBlur  = 0;
}

// ═══ LOOP ═══
var lastT = 0;
function loop(ts) {
  var dt   = lastT ? (ts - lastT)/16.67 : 1;
  if (dt > 3) dt = 3;
  lastT = ts;
  var spd  = getSpd()/5;
  var step = dt * spd;

  // fundo
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.fillStyle = '#030a10';
  cx.fillRect(0, 0, cv.width, cv.height);
  cx.strokeStyle = 'rgba(0,200,220,.04)';
  cx.lineWidth = 1;
  var x, y;
  for (x = 0; x < cv.width; x += 38) {
    cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,cv.height); cx.stroke();
  }
  for (y = 0; y < cv.height; y += 38) {
    cx.beginPath(); cx.moveTo(0,y); cx.lineTo(cv.width,y); cx.stroke();
  }

  var p = getPos();

  // linha de contato — brilha durante o atrito
  if (S.rubbing || S.gA > 0.05) {
    var alpha = S.rubbing ? 0.7 : S.gA * 0.6;
    var top    = Math.min(p.ay, p.by) - p.h/2;
    var bottom = Math.max(p.ay, p.by) + p.h/2;
    cx.globalAlpha = alpha;
    cx.strokeStyle = '#f5e200';
    cx.lineWidth   = 2;
    cx.shadowColor = '#f5e200';
    cx.shadowBlur  = 12;
    cx.beginPath();
    cx.moveTo(cv.width/2, top);
    cx.lineTo(cv.width/2, bottom);
    cx.stroke();
    cx.globalAlpha = 1;
    cx.shadowBlur  = 0;
  }

  drawObj(p.ax, p.ay, p.w, p.h, document.getElementById('selA').value, S.cA, S.gA);
  drawObj(p.bx, p.by, p.w, p.h, document.getElementById('selB').value, S.cB, S.gB);
  drawParticles();

  // deslizamento — A e B se movem em sentidos opostos no eixo Y
  if (S.rubbing) {
    S.rubOff += S.rubDir * 3.5 * step;
    if (S.rubOff > 22 || S.rubOff < -22) S.rubDir *= -1;
  } else {
    S.rubOff = S.rubOff * (1 - 0.14*step);
    if (S.rubOff < 0.15 && S.rubOff > -0.15) S.rubOff = 0;
  }

  // atualizar partículas
  var i;
  for (i = S.elec.length-1; i >= 0; i--) {
    S.elec[i].x  += S.elec[i].vx * step;
    S.elec[i].y  += S.elec[i].vy * step;
    S.elec[i].life -= step;
    if (S.elec[i].life <= 0) S.elec.splice(i,1);
  }
  for (i = S.sparks.length-1; i >= 0; i--) {
    S.sparks[i].x  += S.sparks[i].vx * step;
    S.sparks[i].y  += S.sparks[i].vy * step;
    S.sparks[i].vy += 0.15 * step;
    S.sparks[i].life -= step;
    if (S.sparks[i].life <= 0) S.sparks.splice(i,1);
  }
  for (i = S.labs.length-1; i >= 0; i--) {
    S.labs[i].y    -= 0.4 * step;
    S.labs[i].life -= step;
    if (S.labs[i].life <= 0) S.labs.splice(i,1);
  }

  S.gA = S.gA > 0 ? S.gA - 0.025*step : 0;
  S.gB = S.gB > 0 ? S.gB - 0.025*step : 0;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ═══ FÍSICA ═══
function spawn_e(fx,fy,tx,ty,n) {
  for (var i=0; i<n; i++) {
    var sx = fx+(Math.random()-.5)*20;
    var sy = fy+(Math.random()-.5)*20;
    var dx = tx-sx+(Math.random()-.5)*40;
    var dy = ty-sy+(Math.random()-.5)*40;
    var d  = Math.sqrt(dx*dx+dy*dy)||1;
    var sp = 1.8+Math.random()*1.5;
    var lf = d/sp+10;
    S.elec.push({x:sx,y:sy,vx:dx/d*sp,vy:dy/d*sp,life:lf,ml:lf});
  }
}
function spawn_s(x,y,n) {
  for (var i=0; i<n; i++) {
    var a = Math.random()*6.2832;
    var sp = 1+Math.random()*2.5;
    S.sparks.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:20+Math.random()*18,ml:38});
  }
}
function spawn_l(x,y,charge) {
  S.labs.push({
    x:x+(Math.random()-.5)*40,
    y:y - 30 - Math.random()*20,
    t: charge>0 ? '+' : '-',
    c: charge>0 ? '#f5e200' : '#00f0ff',
    sz:16+Math.floor(Math.random()*10),
    life:60, ml:60
  });
}

function doRub() {
  var kA   = document.getElementById('selA').value;
  var kB   = document.getElementById('selB').value;
  var diff = MAT[kA].tv - MAT[kB].tv;
  if (diff === 0) { addLog('Mesma posição triboelétrica — sem transferência.','ev'); return; }
  if (Math.abs(S.cA) >= S.MAX) { addLog('Carga máxima atingida!','ev'); return; }

  var amt = Math.ceil(Math.abs(diff)*getInt()/8);
  if (amt < 1) amt = 1;
  if (amt > 3) amt = 3;

  var p  = getPos();
  var mx = (p.ax+p.bx)/2;
  var my = (p.ay+p.by)/2;

  if (diff > 0) {
    S.cA = S.cA+amt; if (S.cA > S.MAX) S.cA = S.MAX;
    S.cB = S.cB-amt; if (S.cB < -S.MAX) S.cB = -S.MAX;
    spawn_e(p.ax,p.ay,p.bx,p.by,amt+2);
    spawn_l(p.ax,p.ay,1); spawn_l(p.bx,p.by,-1);
  } else {
    S.cA = S.cA-amt; if (S.cA < -S.MAX) S.cA = -S.MAX;
    S.cB = S.cB+amt; if (S.cB > S.MAX)  S.cB = S.MAX;
    spawn_e(p.bx,p.by,p.ax,p.ay,amt+2);
    spawn_l(p.bx,p.by,1); spawn_l(p.ax,p.ay,-1);
  }

  spawn_s(cv.width/2, (p.ay + p.by)/2, 7);
  S.gA = 0.9; S.gB = 0.9;
  updateUI();

  var sa = S.cA>=0 ? '+'+S.cA : ''+S.cA;
  var sb = S.cB>=0 ? '+'+S.cB : ''+S.cB;
  addLog(MAT[kA].name+': '+sa+' u.c.  |  '+MAT[kB].name+': '+sb+' u.c.');
}

// ═══ AÇÕES ═══
function startRub() {
  if (S.rubbing) return;
  S.rubbing = true; S.rubDir = 1; S.rubCycle = 0;
  document.getElementById('btnRub').disabled = true;
  document.getElementById('hint').style.opacity = '0';
  var cycles = 6;
  var delay  = 350 - getSpd()*28; if (delay < 80) delay = 80;
  var t = setInterval(function() {
    doRub(); S.rubCycle++;
    if (S.rubCycle >= cycles) {
      clearInterval(t);
      S.rubbing = false;
      document.getElementById('btnRub').disabled = false;
    }
  }, delay);
}

function toggleAuto() {
  S.autoOn = !S.autoOn;
  var btn = document.getElementById('btnAuto');
  if (S.autoOn) {
    btn.textContent = '■ Parar Auto';
    btn.className = 'btn bp';
    document.getElementById('hint').style.opacity = '0';
    S.autoTimer = setInterval(function(){ if (!S.rubbing) startRub(); }, 1000);
    addLog('Modo automático ATIVADO.','ev');
  } else {
    btn.textContent = '↻ Auto';
    btn.className = 'btn by';
    clearInterval(S.autoTimer);
    addLog('Modo automático desativado.','ev');
  }
}

function resetSim() {
  S.cA=0; S.cB=0; S.rubbing=false; S.rubOff=0;
  S.elec=[]; S.sparks=[]; S.labs=[];
  S.gA=0; S.gB=0;
  if (S.autoOn) toggleAuto();
  document.getElementById('btnRub').disabled = false;
  document.getElementById('hint').style.opacity = '1';
  updateUI();
  addLog('Simulação resetada.','rs');
}

// ═══ UI ═══
function getInt() { return parseInt(document.getElementById('sI').value); }
function getSpd() { return parseInt(document.getElementById('sS').value); }

function updateUI() {
  function setM(vid,bid,charge) {
    var el = document.getElementById(vid);
    el.textContent = charge>=0 ? '+'+charge : ''+charge;
    el.className = 'mv '+(charge>0?'pos':charge<0?'neg':'neu');
    var b = document.getElementById(bid);
    b.style.width = Math.abs(charge)/S.MAX*100+'%';
    b.style.background = charge>0 ? '#f5e200' : '#00f0ff';
  }
  setM('mvA','bbA',S.cA);
  setM('mvB','bbB',S.cB);
  var kA = document.getElementById('selA').value;
  var kB = document.getElementById('selB').value;
  document.getElementById('mnA').textContent = MAT[kA].name.toUpperCase();
  document.getElementById('mnB').textContent = MAT[kB].name.toUpperCase();
}

function updateDesc() {
  var kA = document.getElementById('selA').value;
  var kB = document.getElementById('selB').value;
  function tend(tv) { return tv>=4 ? '<span style="color:#f5e200">&#8593; Cede elétrons (fica +)</span>' : '<span style="color:#00f0ff">&#8595; Recebe elétrons (fica -)</span>'; }
  document.getElementById('dA').innerHTML = '<b style="color:#d0f0ff">'+MAT[kA].name+':</b> '+MAT[kA].desc+'<br>'+tend(MAT[kA].tv);
  document.getElementById('dB').innerHTML = '<b style="color:#d0f0ff">'+MAT[kB].name+':</b> '+MAT[kB].desc+'<br>'+tend(MAT[kB].tv);
}

function onMat() { updateDesc(); resetSim(); }

function addLog(msg, cls) {
  var box = document.getElementById('log');
  var now = new Date();
  var t   = ('0'+now.getMinutes()).slice(-2)+':'+('0'+now.getSeconds()).slice(-2);
  var d   = document.createElement('div');
  d.className = 'le';
  d.innerHTML = '<span class="lt">'+t+'</span><span class="lm'+(cls?' l'+cls:'')+'">'+msg+'</span>';
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  while (box.children.length > 40) box.removeChild(box.firstChild);
}

// INIT
updateDesc();
updateUI();
addLog('Simulador iniciado. Escolha os materiais e friccione!','ev');
</script>
